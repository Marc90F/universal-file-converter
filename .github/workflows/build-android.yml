name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'core/**'
      - 'engines/**'
      - 'buildozer.spec'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    name: Build Multi-Architecture Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Buildozer & Cython
        run: |
          pip install --upgrade pip
          pip install --upgrade Cython==0.29.36 buildozer

      - name: Build Android APK with Buildozer
        run: |
          # Build APK per arm64-v8a, armeabi-v7a, x86_64
          buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniversalFileConverter-Android-APK
          path: bin/*.apk

      - name: Attach APK to GitHub Release v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Trova l'APK compilato e assegna un nome standard
          APK_FILE=$(ls bin/*.apk | head -n 1)
          if [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" universal-file-converter-v1.0.0.apk
            gh release upload v1.0.0 universal-file-converter-v1.0.0.apk --clobber || true
          fi
