name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - 'core/**'
      - 'engines/**'
      - 'main.py'
      - 'buildozer.spec'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

jobs:
  build:
    name: Build Multi-Architecture Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config zlib1g-dev \
            libncurses-dev cmake libffi-dev libssl-dev ccache

      - name: Install Buildozer & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade Cython==0.29.36 buildozer virtualenv

      - name: Build Android APK with Buildozer
        run: |
          # Compila l'APK universale per ARM64-v8a e ARMv7
          buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: UniversalFileConverter-Android-APK
          path: bin/*.apk

      - name: Attach APK to GitHub Release v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Individua l'APK compilato e caricalo sulla Release v1.0.0
          APK_FILE=$(ls bin/*.apk 2>/dev/null | head -n 1)
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            echo "Trovato APK compilato: $APK_FILE"
            cp "$APK_FILE" universal-file-converter-v1.0.0.apk
            gh release upload v1.0.0 universal-file-converter-v1.0.0.apk --clobber
            echo "APK caricato con successo sulla Release v1.0.0!"
          else
            echo "Nessun file APK trovato in bin/"
            exit 1
          fi
